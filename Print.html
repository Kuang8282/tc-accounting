<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TC พิมพ์เอกสาร</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sarabun',sans-serif;font-size:13px;background:#e0e0e0;color:#212121;}
.print-controls{background:#1a237e;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
.print-controls h2{font-size:16px;}
.btn{border:none;border-radius:4px;padding:6px 14px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;}
.btn-light{background:#fff;color:#1a237e;}
.btn-success{background:#2e7d32;color:#fff;}
.doc-selector{margin:12px auto;max-width:900px;background:#fff;border-radius:8px;padding:14px 16px;box-shadow:0 2px 4px rgba(0,0,0,.1);}
.doc-selector h3{font-weight:700;margin-bottom:8px;color:#1a237e;}
.doc-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.doc-tab{padding:6px 16px;border:2px solid #c5cae9;border-radius:4px;cursor:pointer;font-weight:600;color:#3949ab;background:#fff;font-size:13px;}
.doc-tab.active{background:#1a237e;color:#fff;border-color:#1a237e;}
.spinner{width:32px;height:32px;border:4px solid #ddd;border-top-color:#1a237e;border-radius:50%;animation:spin .7s linear infinite;margin:40px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
/* Month filter for tax report */
.tax-filter{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap;}
.tax-filter label{font-size:12px;font-weight:600;color:#555;}
.tax-filter input,.tax-filter select{border:1px solid #ccc;border-radius:4px;padding:4px 8px;font-size:13px;font-family:inherit;}
/* Item selector for tax report */
.item-selector{margin-top:8px;}
.item-selector label{font-size:12px;font-weight:600;color:#555;display:block;margin-bottom:4px;}
.item-check-list{display:flex;gap:8px;flex-wrap:wrap;}
.item-check-list label{font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;}

/* DOCUMENT PAGE */
.page-container{max-width:900px;margin:12px auto;display:flex;flex-direction:column;gap:20px;}
.doc-page{background:#fff;width:210mm;margin:0 auto;padding:8mm 10mm;box-shadow:0 2px 8px rgba(0,0,0,.2);position:relative;page-break-after:always;}

/* COMPANY HEADER */
.co-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:4mm;margin-bottom:4mm;}
.co-left h2{font-size:14px;font-weight:700;margin-bottom:2px;}
.co-left p{font-size:11px;line-height:1.5;color:#333;}
.co-right{text-align:right;}
.doc-title-th{font-size:13px;font-weight:700;color:#333;}
.doc-title-en{font-size:11px;color:#555;margin-top:2px;}
.doc-taxid{font-size:11px;margin-top:4px;color:#333;}

/* TENANT INFO */
.tenant-grid{display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm;margin-bottom:4mm;font-size:12px;}
.t-row{display:flex;gap:4px;}
.t-label{color:#555;min-width:80px;white-space:nowrap;}
.t-value{font-weight:600;}

/* ITEMS TABLE */
.items-table{width:100%;border-collapse:collapse;margin-bottom:3mm;font-size:12px;}
.items-table th{background:#1a237e;color:#fff;padding:4px 6px;text-align:center;border:1px solid #999;}
.items-table th.text-left{text-align:left;}
.items-table td{padding:3px 6px;border:1px solid #ccc;vertical-align:middle;}
.items-table td.text-right{text-align:right;}
.items-table td.text-center{text-align:center;}
.items-table tr.vat-row td{background:#f8f9ff;font-size:11px;}
.items-table tr.total-row td{font-weight:700;background:#e8eaf6;border-top:2px solid #1a237e;}

/* VAT SUMMARY BOX */
.vat-box{display:flex;justify-content:flex-end;margin-bottom:3mm;}
.vat-table{font-size:12px;min-width:260px;}
.vat-table td{padding:2px 8px;}
.vat-table td.text-right{text-align:right;}
.vat-table tr.grand-row td{font-weight:700;font-size:14px;border-top:2px solid #1a237e;padding-top:4px;}

/* SIGNATURES */
.sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;margin-top:6mm;}
.sig-box{text-align:center;font-size:11px;}
.sig-line{border-bottom:1px solid #333;height:20px;margin-bottom:3px;}

/* PAID STAMP */
.paid-stamp{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%) rotate(-15deg);border:4px solid #2e7d32;color:#2e7d32;font-size:26px;font-weight:700;padding:6px 18px;border-radius:8px;opacity:.25;pointer-events:none;}

/* TAX REPORT */
.tax-report-header{margin-bottom:5mm;}
.tax-report-header h2{font-size:15px;font-weight:700;text-align:center;}
.tax-report-header .co-name{font-size:13px;text-align:center;margin:2px 0;}
.tax-report-header .meta{display:flex;justify-content:space-between;font-size:12px;margin-top:4mm;}
.tax-table{width:100%;border-collapse:collapse;font-size:11px;}
.tax-table th{background:#1a237e;color:#fff;padding:5px 6px;text-align:center;border:1px solid #999;}
.tax-table th.text-left{text-align:left;}
.tax-table td{padding:3px 6px;border:1px solid #ccc;}
.tax-table td.text-right{text-align:right;}
.tax-table tr.total-row td{font-weight:700;background:#e8eaf6;border-top:2px solid #1a237e;}

/* SEPARATOR */
.page-separator{text-align:center;color:#999;font-size:11px;padding:4px 0;display:flex;align-items:center;gap:8px;}
.page-separator::before,.page-separator::after{content:'';flex:1;height:1px;background:#ccc;}

@media print {
  .print-controls,.doc-selector,.page-separator{display:none!important;}
  body{background:#fff;}
  .doc-page{box-shadow:none;margin:0;padding:6mm 8mm;width:100%;page-break-after:always;}
  .page-container{margin:0;gap:0;}
}
</style>
</head>
<body>

<div class="print-controls">
  <h2>🖨️ TC พิมพ์เอกสาร</h2>
  <button class="btn btn-success" onclick="window.print()">🖨️ พิมพ์</button>
  <button class="btn btn-light" onclick="window.close()">✕ ปิด</button>
  <span id="print-status" style="margin-left:auto;font-size:13px"></span>
</div>

<div class="doc-selector">
  <h3>ประเภทเอกสาร</h3>
  <div class="doc-tabs">
    <div class="doc-tab active" id="tab-invoice">📄 ใบแจ้งหนี้</div>
    <div class="doc-tab" id="tab-receipt">🧾 ใบเสร็จ / ใบกำกับภาษี</div>
    <div class="doc-tab" id="tab-tax-sale">📊 รายงานภาษีขาย</div>
    <div class="doc-tab" id="tab-tax-buy">📑 รายงานภาษีซื้อ</div>
  </div>

  <div id="tax-options" style="display:none">
    <div class="tax-filter">
      <label>เดือน:</label>
      <input type="month" id="tax-month">
      <label>อาคาร:</label>
      <select id="tax-building">
        <option value="">ทุกอาคาร</option>
        <option>V1</option><option>V2</option><option>V3</option><option>V4</option>
      </select>
      <button class="btn btn-success btn-sm" id="btn-render-tax">แสดงรายงาน</button>
    </div>
    <div class="item-selector" id="nv-item-selector">
      <label>รายการที่ <strong>ไม่มี VAT</strong> (NV):</label>
      <div class="item-check-list" id="nv-checkboxes">
        <label><input type="checkbox" value="ค่าเช่า" checked> ค่าเช่า</label>
        <label><input type="checkbox" value="เงินประกัน"> เงินประกัน</label>
        <label><input type="checkbox" value="ค่าปรับ"> ค่าปรับ</label>
        <label><input type="checkbox" value="เงินมัดจำ"> เงินมัดจำ</label>
      </div>
    </div>
  </div>
</div>

<div id="loading-box" style="text-align:center;padding:40px"><div class="spinner"></div><p style="color:#666;margin-top:8px">กำลังโหลด...</p></div>
<div class="page-container" id="pages-container"></div>

<script>
const $ = id => document.getElementById(id);
let billData = [];
let docType = 'invoice';
let companies = {};
let allBills = [];

const fmt = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:0});
const fmtDate = d => {
  if(!d) return '';
  try {
    const dt = (d instanceof Date) ? d : new Date(d);
    if(isNaN(dt)) return String(d);
    return dt.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'});
  } catch(e){ return String(d); }
};
const fmtDateShort = d => {
  if(!d) return '';
  try {
    const dt = (d instanceof Date) ? d : new Date(d);
    if(isNaN(dt)) return String(d);
    const day = dt.getDate();
    const month = dt.getMonth()+1;
    const year = dt.getFullYear()+543;
    return `${day}/${month}/${year}`;
  } catch(e){ return String(d); }
};
const thaiMonth = m => {
  const months=['','มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  if(!m) return '';
  const parts = String(m).split('-');
  if(parts.length < 2) return m;
  return `${months[parseInt(parts[1])]} ${parseInt(parts[0])+543}`;
};

// Tab switching
function setActiveTab(id) {
  document.querySelectorAll('.doc-tab').forEach(t=>t.classList.remove('active'));
  $(id).classList.add('active');
  const isTax = (id === 'tab-tax-sale' || id === 'tab-tax-buy');
  $('tax-options').style.display = isTax ? 'block' : 'none';
  $('nv-item-selector').style.display = (id === 'tab-tax-sale') ? 'block' : 'none';
  if(!isTax) renderPages();
}

$('tab-invoice').addEventListener('click', ()=>{ docType='invoice'; setActiveTab('tab-invoice'); });
$('tab-receipt').addEventListener('click', ()=>{ docType='receipt'; setActiveTab('tab-receipt'); });
$('tab-tax-sale').addEventListener('click', ()=>{ docType='tax-sale'; setActiveTab('tab-tax-sale'); });
$('tab-tax-buy').addEventListener('click', ()=>{ docType='tax-buy'; setActiveTab('tab-tax-buy'); });
$('btn-render-tax').addEventListener('click', renderPages);

// Parse extra items from หมายเหตุบิล
function parseExtraItems(bill) {
  const note = bill['หมายเหตุบิล'] || '';
  const match = note.match(/^(\[.*?\])/);
  let extras = [], plainNote = note;
  if(match) {
    try { extras = JSON.parse(match[1]); plainNote = note.slice(match[0].length).trim(); } catch(e){}
  }
  return { extras, plainNote };
}

// Get NV item names from checkboxes
function getNvItems() {
  return [...document.querySelectorAll('#nv-checkboxes input:checked')].map(c=>c.value);
}

// VAT calculation: items matching NV list are non-VAT, others are VAT-inclusive
function calcVat(bill, nvItems) {
  const rent  = parseFloat(bill['ค่าห้อง'])||0;
  const water = parseFloat(bill['ค่าน้ำ'])||0;
  const elec  = parseFloat(bill['ค่าไฟ'])||0;
  const { extras } = parseExtraItems(bill);

  let nvTotal = 0, vatIncTotal = 0;

  // ค่าเช่า
  if(nvItems.includes('ค่าเช่า')) nvTotal += rent; else vatIncTotal += rent;
  // ค่าน้ำ, ค่าไฟ always VAT-inclusive (per Thai law for utilities)
  vatIncTotal += water + elec;
  // Extra items
  extras.forEach(ex => {
    const amt = parseFloat(ex.amt)||0;
    if(nvItems.includes(ex.cat)) nvTotal += amt; else vatIncTotal += amt;
  });

  const vatBase = vatIncTotal / 1.07;
  const vat = vatIncTotal - vatBase;
  const grandTotal = nvTotal + vatIncTotal;
  return { nvTotal, vatIncTotal, vatBase, vat, grandTotal };
}

window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  const idsStr = params.get('ids');
  if(!idsStr){ $('loading-box').innerHTML='<p style="color:red;padding:40px">ไม่มีข้อมูล</p>'; return; }
  const ids = idsStr.split(',').map(s=>s.trim()).filter(Boolean);
  try {
    const [data, cfg] = await Promise.all([
      new Promise((res,rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).getPrintData(ids)),
      new Promise((res,rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).getConfig())
    ]);
    billData  = data  || [];
    companies = cfg.companies || {};
    $('loading-box').style.display = 'none';
    $('print-status').textContent = `${billData.length} รายการ`;
    // Set default tax month from first bill
    if(billData.length) {
      const m = billData[0]['เดือน'];
      if(m) $('tax-month').value = m;
    }
    renderPages();
  } catch(e){
    $('loading-box').innerHTML = `<p style="color:red;padding:40px">เกิดข้อผิดพลาด: ${e}</p>`;
  }
});

function renderPages(){
  const container = $('pages-container');
  if(!billData.length){ container.innerHTML='<p style="text-align:center;color:#999;padding:40px">ไม่มีข้อมูล</p>'; return; }
  if(docType === 'tax-sale') { renderTaxSaleReport(container); return; }
  if(docType === 'tax-buy')  { renderTaxBuyReport(container);  return; }
  let html = '';
  billData.forEach((bill, i) => {
    if(i > 0) html += `<div class="page-separator">— หน้าถัดไป —</div>`;
    html += docType === 'invoice' ? buildInvoicePage(bill) : buildReceiptPage(bill);
  });
  container.innerHTML = html;
}

// ============================================================
// SHARED HEADER
// ============================================================
function buildCoHeader(bill, titleTh, titleEn, docNo, docDate) {
  const co = companies[bill['อาคาร']] || bill.company || {};
  return `<div class="co-header">
    <div class="co-left">
      <h2>${co.name||''} (สำนักงานใหญ่)</h2>
      <p>${co.address||''}<br>
      โทรศัพท์ ${co.phone||'02-997-7700'} &nbsp; แฟกซ์ ${co.fax||'02-997-7690'}</p>
    </div>
    <div class="co-right">
      <div class="doc-title-th">${titleTh}</div>
      <div class="doc-title-en">${titleEn}</div>
      <div class="doc-taxid">เลขประจำตัวผู้เสียภาษีอากร ${co.taxId||''}</div>
      <div style="font-size:11px;margin-top:4px;">
        วันที่ ${docDate}<br>
        เลขที่ ${docNo}
      </div>
    </div>
  </div>`;
}

// ============================================================
// INVOICE
// ============================================================
function buildInvoicePage(bill) {
  const isPaid = bill['สถานะ'] === 'ชำระแล้ว';
  const { extras, plainNote } = parseExtraItems(bill);
  const nvItems = getNvItems();
  const rent  = parseFloat(bill['ค่าห้อง'])||0;
  const water = parseFloat(bill['ค่าน้ำ'])||0;
  const elec  = parseFloat(bill['ค่าไฟ'])||0;
  const { nvTotal, vatIncTotal, vatBase, vat, grandTotal } = calcVat(bill, nvItems);
  const issueDate = fmtDate(new Date());

  let itemRows = '';
  let seq = 1;
  if(rent > 0) itemRows += `<tr><td class="text-center">${seq++}</td><td>ค่าเช่าห้อง</td><td class="text-center">—</td><td class="text-center">—</td><td class="text-right">${fmt(rent)}</td></tr>`;
  extras.forEach(ex => {
    if((parseFloat(ex.amt)||0) > 0)
      itemRows += `<tr><td class="text-center">${seq++}</td><td>${ex.cat}${ex.desc?' — '+ex.desc:''}</td><td class="text-center">—</td><td class="text-center">—</td><td class="text-right">${fmt(ex.amt)}</td></tr>`;
  });
  if(water > 0) {
    const wRange = (bill['หน่วยน้ำก่อน']||bill['หน่วยน้ำปัจจุบัน']) ? `[${bill['หน่วยน้ำก่อน']||0} - ${bill['หน่วยน้ำปัจจุบัน']||0}]` : '';
    itemRows += `<tr><td class="text-center">${seq++}</td><td>ค่าน้ำ ${wRange}</td><td class="text-center">${bill['หน่วยน้ำใช้']||0}</td><td class="text-center">${fmt(bill['อัตราน้ำ']||0)}</td><td class="text-right">${fmt(water)}</td></tr>`;
  }
  if(elec > 0) {
    const eRange = (bill['หน่วยไฟก่อน']||bill['หน่วยไฟปัจจุบัน']) ? `[${bill['หน่วยไฟก่อน']||0} - ${bill['หน่วยไฟปัจจุบัน']||0}]` : '';
    itemRows += `<tr><td class="text-center">${seq++}</td><td>ค่าไฟ ${eRange}</td><td class="text-center">${bill['หน่วยไฟใช้']||0}</td><td class="text-center">${fmt(bill['อัตราไฟ']||0)}</td><td class="text-right">${fmt(elec)}</td></tr>`;
  }

  return `<div class="doc-page">
    ${isPaid ? '<div class="paid-stamp">ชำระแล้ว</div>' : ''}
    ${buildCoHeader(bill, 'ใบแจ้งหนี้ / ใบเสร็จรับเงิน / ใบกำกับภาษีอย่างย่อ (สำเนา)', 'TAX INVOICE / RECEIPT (ORIGINAL)', bill['เลขที่ใบกำกับ']||'-', issueDate)}

    <div class="tenant-grid">
      <div>
        <div class="t-row"><span class="t-label">ชื่อ:</span><span class="t-value">${bill['ผู้เช่า']||'-'}</span></div>
        <div class="t-row"><span class="t-label">ห้องเลขที่:</span><span class="t-value">${bill['ห้อง']} (อาคาร ${bill['อาคาร']})</span></div>
      </div>
      <div>
        <div class="t-row"><span class="t-label">วันที่:</span><span class="t-value">${fmtDate(new Date())}</span></div>
        <div class="t-row"><span class="t-label">ประจำเดือน:</span><span class="t-value">${thaiMonth(bill['เดือน'])}</span></div>
      </div>
    </div>

    <table class="items-table">
      <thead><tr>
        <th style="width:32px">#</th>
        <th class="text-left">รายการ</th>
        <th style="width:60px">จำนวน</th>
        <th style="width:70px">ราคา/หน่วย</th>
        <th style="width:90px" class="text-right">จำนวนเงิน (฿)</th>
      </tr></thead>
      <tbody>
        ${itemRows}
        <tr class="vat-row">
          <td colspan="4" class="text-right">มูลค่าสินค้าที่ไม่รวมภาษีมูลค่าเพิ่ม (NV)</td>
          <td class="text-right">${fmt(nvTotal)}</td>
        </tr>
        <tr class="vat-row">
          <td colspan="4" class="text-right">มูลค่าสินค้าที่รวมภาษีมูลค่าเพิ่ม 7% (V)</td>
          <td class="text-right">${fmt(vatBase)}</td>
        </tr>
        <tr class="vat-row">
          <td colspan="4" class="text-right">ภาษีมูลค่าเพิ่ม 7%</td>
          <td class="text-right">${fmt(vat)}</td>
        </tr>
        <tr class="total-row">
          <td colspan="4" class="text-right">รวมทั้งสิ้น</td>
          <td class="text-right">${fmt(grandTotal)}</td>
        </tr>
      </tbody>
    </table>
    ${plainNote ? `<p style="font-size:11px;color:#555;margin-bottom:3mm">หมายเหตุ: ${plainNote}</p>` : ''}
    <div class="sig-grid">
      <div class="sig-box"><div class="sig-line"></div>ผู้แจ้งหนี้<br>(............../............../.............)</div>
      <div class="sig-box"><div class="sig-line"></div>ผู้รับแจ้งหนี้<br>(............../............../.............)</div>
      <div class="sig-box"><div class="sig-line"></div>วันที่ชำระ<br>(............../............../.............)</div>
    </div>
    <p style="font-size:10px;color:#999;text-align:center;margin-top:4mm">กรุณาชำระภายในวันที่ 5 ของเดือน หากเกินกำหนดจะมีค่าปรับ</p>
  </div>`;
}

// ============================================================
// RECEIPT / TAX INVOICE
// ============================================================
function buildReceiptPage(bill) {
  const { extras, plainNote } = parseExtraItems(bill);
  const nvItems = getNvItems();
  const rent  = parseFloat(bill['ค่าห้อง'])||0;
  const water = parseFloat(bill['ค่าน้ำ'])||0;
  const elec  = parseFloat(bill['ค่าไฟ'])||0;
  const { nvTotal, vatIncTotal, vatBase, vat, grandTotal } = calcVat(bill, nvItems);
  const payDate = bill['วันที่ชำระ'] ? fmtDate(bill['วันที่ชำระ']) : fmtDate(new Date());

  let itemRows = '';
  let seq = 1;
  if(rent > 0) itemRows += `<tr><td class="text-center">${seq++}</td><td>ค่าเช่าห้อง</td><td class="text-center">—</td><td class="text-center">—</td><td class="text-right">${fmt(rent)}</td></tr>`;
  extras.forEach(ex => {
    if((parseFloat(ex.amt)||0) > 0)
      itemRows += `<tr><td class="text-center">${seq++}</td><td>${ex.cat}${ex.desc?' — '+ex.desc:''}</td><td class="text-center">—</td><td class="text-center">—</td><td class="text-right">${fmt(ex.amt)}</td></tr>`;
  });
  if(water > 0) {
    const wRange = (bill['หน่วยน้ำก่อน']||bill['หน่วยน้ำปัจจุบัน']) ? `[${bill['หน่วยน้ำก่อน']||0} - ${bill['หน่วยน้ำปัจจุบัน']||0}]` : '';
    itemRows += `<tr><td class="text-center">${seq++}</td><td>ค่าน้ำ ${wRange}</td><td class="text-center">${bill['หน่วยน้ำใช้']||0}</td><td class="text-center">${fmt(bill['อัตราน้ำ']||0)}</td><td class="text-right">${fmt(water)}</td></tr>`;
  }
  if(elec > 0) {
    const eRange = (bill['หน่วยไฟก่อน']||bill['หน่วยไฟปัจจุบัน']) ? `[${bill['หน่วยไฟก่อน']||0} - ${bill['หน่วยไฟปัจจุบัน']||0}]` : '';
    itemRows += `<tr><td class="text-center">${seq++}</td><td>ค่าไฟ ${eRange}</td><td class="text-center">${bill['หน่วยไฟใช้']||0}</td><td class="text-center">${fmt(bill['อัตราไฟ']||0)}</td><td class="text-right">${fmt(elec)}</td></tr>`;
  }

  return `<div class="doc-page">
    <div class="paid-stamp">ชำระแล้ว</div>
    ${buildCoHeader(bill, 'ใบแจ้งหนี้ / ใบเสร็จรับเงิน / ใบกำกับภาษีอย่างย่อ (สำเนา)', 'TAX INVOICE / RECEIPT (ORIGINAL)', bill['เลขที่ใบกำกับ']||'-', payDate)}

    <div class="tenant-grid">
      <div>
        <div class="t-row"><span class="t-label">ชื่อ:</span><span class="t-value">${bill['ผู้เช่า']||'-'}</span></div>
        <div class="t-row"><span class="t-label">ห้องเลขที่:</span><span class="t-value">${bill['ห้อง']} (อาคาร ${bill['อาคาร']})</span></div>
      </div>
      <div>
        <div class="t-row"><span class="t-label">วันที่ชำระ:</span><span class="t-value" style="color:#2e7d32">${payDate}</span></div>
        <div class="t-row"><span class="t-label">ประจำเดือน:</span><span class="t-value">${thaiMonth(bill['เดือน'])}</span></div>
      </div>
    </div>

    <table class="items-table">
      <thead><tr>
        <th style="width:32px">#</th>
        <th class="text-left">รายการ</th>
        <th style="width:60px">จำนวน</th>
        <th style="width:70px">ราคา/หน่วย</th>
        <th style="width:90px" class="text-right">จำนวนเงิน (฿)</th>
      </tr></thead>
      <tbody>
        ${itemRows}
        <tr class="vat-row">
          <td colspan="4" class="text-right">มูลค่าสินค้าที่ไม่รวมภาษีมูลค่าเพิ่ม (NV)</td>
          <td class="text-right">${fmt(nvTotal)}</td>
        </tr>
        <tr class="vat-row">
          <td colspan="4" class="text-right">มูลค่าสินค้าที่รวมภาษีมูลค่าเพิ่ม 7% (V)</td>
          <td class="text-right">${fmt(vatBase)}</td>
        </tr>
        <tr class="vat-row">
          <td colspan="4" class="text-right">ภาษีมูลค่าเพิ่ม 7%</td>
          <td class="text-right">${fmt(vat)}</td>
        </tr>
        <tr class="total-row">
          <td colspan="4" class="text-right">รวมทั้งสิ้น</td>
          <td class="text-right">${fmt(grandTotal)}</td>
        </tr>
      </tbody>
    </table>
    ${plainNote ? `<p style="font-size:11px;color:#555;margin-bottom:3mm">หมายเหตุ: ${plainNote}</p>` : ''}
    <div class="sig-grid">
      <div class="sig-box"><div class="sig-line"></div>ผู้รับเงิน<br>(............../............../.............)</div>
      <div class="sig-box"><div class="sig-line"></div>ผู้ชำระเงิน<br>(............../............../.............)</div>
      <div class="sig-box"><div class="sig-line"></div>ประทับตราบริษัท</div>
    </div>
  </div>`;
}

// ============================================================
// TAX SALES REPORT (ภาษีขาย)
// ============================================================
function renderTaxSaleReport(container) {
  const filterMonth = $('tax-month').value;
  const filterBld   = $('tax-building').value;
  const nvItems     = getNvItems();

  // Filter bills: use paid bills for tax report
  let bills = billData.filter(b => b['สถานะ'] === 'ชำระแล้ว');
  if(filterMonth) bills = bills.filter(b => b['เดือน'] === filterMonth);
  if(filterBld)   bills = bills.filter(b => b['อาคาร'] === filterBld);

  const byBuilding = {};
  ['V1','V2','V3','V4'].forEach(v => byBuilding[v] = []);
  bills.forEach(b => { if(byBuilding[b['อาคาร']]) byBuilding[b['อาคาร']].push(b); });

  let html = '';
  ['V1','V2','V3','V4'].forEach(v => {
    const vBills = byBuilding[v];
    if(!vBills.length) return;
    const co = companies[v] || {};
    let totalNV = 0, totalV = 0, totalVAT = 0;

    const rows = vBills.map((b, i) => {
      const { nvTotal, vatBase, vat } = calcVat(b, nvItems);
      totalNV  += nvTotal;
      totalV   += vatBase;
      totalVAT += vat;
      const payDate = b['วันที่ชำระ'] ? fmtDateShort(b['วันที่ชำระ']) : '-';
      return `<tr>
        <td class="text-center">${i+1}</td>
        <td class="text-center">${b['ห้อง']}</td>
        <td class="text-center">${payDate}</td>
        <td>${b['เลขที่ใบกำกับ']||'-'}</td>
        <td>${b['ผู้เช่า']||''}</td>
        <td class="text-right">${fmt(nvTotal)}</td>
        <td class="text-right">${fmt(vatBase)}</td>
        <td class="text-right">${fmt(vat)}</td>
      </tr>`;
    }).join('');

    const reportMonth = filterMonth ? thaiMonth(filterMonth) : '—';
    const reportYear  = filterMonth ? (parseInt(filterMonth.split('-')[0])+543) : '—';

    html += `<div class="doc-page">
      <div class="tax-report-header">
        <h2>บัญชีรายงานภาษีขาย</h2>
        <div class="co-name">${co.name||v}</div>
        <div class="meta">
          <div>ชื่อผู้ประกอบการ: ${co.name||v}<br>
          สถานประกอบการ: ${co.name||v}<br>
          เลขประจำตัวผู้เสียภาษี: ${co.taxId||''}</div>
          <div style="text-align:right">ประจำเดือน: <strong>${reportMonth} ${reportYear}</strong></div>
        </div>
      </div>
      <table class="tax-table">
        <thead>
          <tr>
            <th style="width:36px">ลำดับที่</th>
            <th style="width:54px">เลขที่ห้อง</th>
            <th style="width:72px">วัน/เดือน/ปี</th>
            <th style="width:100px" class="text-left">เลขที่ใบกำกับภาษี</th>
            <th class="text-left">รายการ (ชื่อผู้เช่า)</th>
            <th style="width:88px" class="text-right">มูลค่าสินค้า NV</th>
            <th style="width:88px" class="text-right">มูลค่าสินค้า V</th>
            <th style="width:78px" class="text-right">ภาษีมูลค่าเพิ่ม</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr class="total-row">
            <td colspan="5" class="text-right">รวม</td>
            <td class="text-right">${fmt(totalNV)}</td>
            <td class="text-right">${fmt(totalV)}</td>
            <td class="text-right">${fmt(totalVAT)}</td>
          </tr>
        </tbody>
      </table>
      <div class="sig-grid" style="margin-top:10mm">
        <div class="sig-box"><div class="sig-line"></div>ผู้จัดทำ<br>(............../............../.............)</div>
        <div class="sig-box"><div class="sig-line"></div>ผู้ตรวจสอบ<br>(............../............../.............)</div>
        <div class="sig-box"><div class="sig-line"></div>ผู้อนุมัติ<br>(............../............../.............)</div>
      </div>
    </div>`;
  });

  container.innerHTML = html || '<p style="text-align:center;color:#999;padding:40px">ไม่มีข้อมูล กรุณาเลือกเดือนและกดแสดงรายงาน</p>';
}
